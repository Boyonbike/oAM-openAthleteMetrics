[versions]
# ── Build toolchain ──────────────────────────────────────────────────────────
agp                     = "9.2.1"
kotlin                  = "2.2.10"
# KSP version MUST match Kotlin version exactly (major.minor.patch).
# Check https://github.com/google/ksp/releases for the latest 2.2.10-x.x.x tag.
# NOTE: Kotlin 2.4.0 is not yet supported by KSP (google/ksp#2965); bump Kotlin+KSP together.
ksp                     = "2.2.10-2.0.2"

# ── AndroidX core ────────────────────────────────────────────────────────────
coreKtx                 = "1.19.0"

# ── Compose ──────────────────────────────────────────────────────────────────
# The BOM pins every androidx.compose.* version in one place.
composeBom              = "2026.06.00"
activityCompose         = "1.13.0"

# ── Lifecycle / ViewModel ────────────────────────────────────────────────────
lifecycle               = "2.11.0"

# ── Navigation ───────────────────────────────────────────────────────────────
navigationCompose       = "2.9.8"

# ── Room (SQLite ORM) ────────────────────────────────────────────────────────
room                    = "2.8.4"

# ── Hilt (dependency injection) ──────────────────────────────────────────────
hilt                    = "2.59.2"
# hiltAndroidX covers all androidx.hilt:* artifacts (navigation-compose, work, hilt-compiler)
hiltAndroidX            = "1.3.0"

# ── Coroutines ───────────────────────────────────────────────────────────────
coroutines              = "1.11.0"

# ── DataStore (key-value preferences) ────────────────────────────────────────
datastore               = "1.2.1"

# ── WorkManager ──────────────────────────────────────────────────────────────
workManager             = "2.11.2"

# ── Glance (home-screen widgets) ──────────────────────────────────────────────
# Latest STABLE release only — 1.2.0 is still rc/beta as of this writing.
glance                  = "1.1.1"

# ── Vico (Compose-native charts) ─────────────────────────────────────────────
# compose/compose-m3 jump to 3.2.2 — defer major-version upgrade to a separate task.
vico                    = "2.1.2"

# ── Reorderable (drag-and-drop for Lazy lists/grids) ─────────────────────────
reorderable             = "3.1.0"

# ── Timber (logging) ─────────────────────────────────────────────────────────
timber                  = "5.0.1"

# ── Chicory (pure-Java WASM interpreter) ─────────────────────────────────────
chicory                 = "1.7.5"

# ── kotlinx.serialization ────────────────────────────────────────────────────
kotlinx-serialization   = "1.11.0"

# ── Testing ──────────────────────────────────────────────────────────────────
junit                   = "4.13.2"
junitVersion            = "1.3.0"
espressoCore            = "3.7.0"
mockk                   = "1.14.11"
# Real org.json implementation for local unit tests — Android's test stub jar throws
# "not mocked" for JSONObject; SleepStagePromoter (and its tests) parse real JSON.
json                    = "20231013"
robolectric             = "4.16"


[libraries]
# ── AndroidX core ────────────────────────────────────────────────────────────
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# ── Compose BOM + UI ─────────────────────────────────────────────────────────
# Import the BOM in the app module; all other compose libs omit version.ref.
androidx-compose-bom              = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui               = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics      = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling       = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4   = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3        = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core     = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose         = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ── Lifecycle / ViewModel ────────────────────────────────────────────────────
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# ── Navigation ───────────────────────────────────────────────────────────────
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ── Room ─────────────────────────────────────────────────────────────────────
androidx-room-runtime  = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx      = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
# Annotation processor — referenced with ksp() in app/build.gradle.kts
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ── Hilt ─────────────────────────────────────────────────────────────────────
hilt-android                    = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
# Dagger annotation processor — generates @HiltAndroidApp / @AndroidEntryPoint / @HiltViewModel code
hilt-compiler                   = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# AndroidX Hilt extensions
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltAndroidX" }
# Runtime support for @HiltWorker — needed alongside work-runtime-ktx
androidx-hilt-work               = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltAndroidX" }
# AndroidX Hilt annotation processor — generates code for @HiltWorker (separate from Dagger's hilt-compiler)
androidx-hilt-compiler           = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltAndroidX" }

# ── Coroutines ───────────────────────────────────────────────────────────────
# -android includes the Android main-thread dispatcher; -core is a transitive dep.
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# ── DataStore ────────────────────────────────────────────────────────────────
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ── WorkManager ──────────────────────────────────────────────────────────────
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# ── Glance (home-screen widgets) ──────────────────────────────────────────────
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }

# ── Vico charts ──────────────────────────────────────────────────────────────
vico-compose    = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
vico-core       = { group = "com.patrykandpatrick.vico", name = "core", version.ref = "vico" }

# ── Reorderable ───────────────────────────────────────────────────────────────
reorderable     = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }

# ── Timber ───────────────────────────────────────────────────────────────────
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# ── Chicory ──────────────────────────────────────────────────────────────────
chicory-runtime = { group = "com.dylibso.chicory", name = "runtime", version.ref = "chicory" }

# ── kotlinx.serialization ────────────────────────────────────────────────────
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# ── Testing ──────────────────────────────────────────────────────────────────
junit                   = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit          = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core  = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
mockk                   = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
json                    = { group = "org.json", name = "json", version.ref = "json" }
robolectric             = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
